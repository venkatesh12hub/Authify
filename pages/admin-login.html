
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Authify</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="auth-page">

    <div class="auth-info">
        <a href="../index.html" class="logo">
            <i class="fa-solid fa-shield-halved"></i>
            Authify<span>.</span>
        </a>

        <div class="info-content">
            <div class="info-badge">ADMINISTRATOR PORTAL</div>
            <h1>Manage your platform.
                <span>Stay in control.</span>
            </h1>
            <p>Access the administration portal to manage registered users and account activities.</p>
        </div>

        <div class="info-footer">© 2026 Authify</div>
    </div>

    <div class="auth-form-section">
        <div class="auth-form-wrapper">

            <div class="form-heading">
                <span class="section-tag">ADMIN ACCESS</span>
                <h2>Administrator Login</h2>
                <p>Enter your administrator credentials.</p>
            </div>

            <form id="adminLoginForm" novalidate>

                <div class="form-group">
                    <label for="adminEmail">Admin Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="adminEmail"
                               placeholder="Enter admin email">
                    </div>
                    <small class="error-message" id="adminEmailError"></small>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="adminPassword"
                               placeholder="Enter admin password">
                        <button type="button" class="toggle-password"
                                id="adminTogglePassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-message" id="adminPasswordError"></small>
                </div>

                <button type="submit" class="submit-btn" id="adminLoginBtn">
                    Admin Sign In
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="back-home">
                New administrator? <a href="admin-register.html">Create Admin Account</a>
            </div>

            <div class="back-home">
                <a href="../index.html">
                    <i class="fa-solid fa-arrow-left"></i> Back to Home
                </a>
            </div>

        </div>
    </div>

</div>

<div class="auth-toast" id="authToast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="authToastMessage"></span>
</div>

<script src="../js/storage.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
